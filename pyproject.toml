[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoscan"
version = "0.1.0"
description = "EcoScan: guia inteligente de descarte de resíduos por processamento de imagens e visão computacional."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.45,<2",
    "Authlib>=1.3.2,<2",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.16; python_version < '3.13'",
    "torch>=2.3; python_version < '3.13'",
    "torchvision>=0.18; python_version < '3.13'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ecoscan-analyze-dataset = "ecoscan.services.dataset_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoscan"
version = "0.1.0"
description = "EcoScan: guia inteligente de descarte de resíduos por processamento de imagens e visão computacional."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.22",
    "PyWavelets>=1.6",
    "scikit-learn>=1.4",
    "streamlit>=1.66,<2",
    "Authlib>=1.3.2,<2",
    "supabase>=2.15,<3",
    "onnxruntime==1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ecoscan-analyze-dataset = "ecoscan.services.dataset_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecoscan.ui" = ["*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"] # CLI wrappers add src/ before importing the package.

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Treinamento revisado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training.yml'
      - 'src/ecoscan/training/semantic_learning.py'
      - 'models/semantic-v1/learning_seed.*'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: reviewed-training-production
  cancel-in-progress: false
jobs:
  train:
    if: vars.ECOSCAN_TRAINING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Processar aprovadas e validar candidato
        env:
          ECOSCAN_SUPABASE_URL: ${{ secrets.ECOSCAN_SUPABASE_URL }}
          ECOSCAN_SUPABASE_SERVICE_KEY: ${{ secrets.ECOSCAN_SUPABASE_SERVICE_KEY }}
        run: python scripts/run_automatic_training.py

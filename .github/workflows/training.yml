name: Treinamento revisado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training.yml'
      - 'src/ecoscan/training/semantic_learning.py'
      - 'src/ecoscan/training/diagnostics.py'
      - 'models/semantic-v1/learning_seed.*'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: reviewed-training-production
  cancel-in-progress: false
jobs:
  train:
    if: vars.ECOSCAN_TRAINING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Processar aprovadas e validar candidato
        env:
          ECOSCAN_SUPABASE_URL: ${{ secrets.ECOSCAN_SUPABASE_URL }}
          ECOSCAN_SUPABASE_SERVICE_KEY: ${{ secrets.ECOSCAN_SUPABASE_SERVICE_KEY }}
        run: python scripts/run_reviewed_training.py

# Template only. Configure real values in secrets.toml or hosting Secrets.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"
client_id = "REPLACE_WITH_CLIENT_ID"
client_secret = "REPLACE_WITH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
issuer = "https://accounts.google.com"
admin_emails = []
# Supabase Auth accounts are separate from OIDC accounts. Only verified emails.
supabase_admin_emails = []

# Optional: both values required. Never commit real keys.
# Run migrations/001_contributions.sql before enabling.
# [persistence]
# url = "https://YOUR_PROJECT.supabase.co"
# service_key = "SERVER_ONLY_SERVICE_ROLE_KEY"
